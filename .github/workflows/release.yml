name: Release

# Pousser un tag « v1.2.3 » construit le paquet .deb et publie la release
# correspondante sur GitHub, que l'application détecte comme mise à jour.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # historique complet, pour lister les changements

      - name: Vérifier que le tag correspond à __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' postitte.py)"
          if [ "$tag" != "$code" ]; then
            echo "::error::Le tag v$tag ne correspond pas à __version__ = \"$code\" dans postitte.py"
            exit 1
          fi

      - name: Vérifier la syntaxe
        run: |
          python3 -m py_compile postitte.py
          bash -n install.sh
          bash -n uninstall.sh

      - name: Construire le paquet .deb
        run: bash packaging/build-deb.sh

      - name: Tester l'installation du paquet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/postitte
          dpkg -s postitte | grep '^Version:'

      - name: Rédiger les notes de version
        run: |
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo "### Installation"
            echo "Téléchargez **postitte_${GITHUB_REF_NAME#v}_all.deb** ci-dessous puis double-cliquez dessus pour l'installer."
            echo
            echo "Déjà installé ? Postitte vous proposera cette mise à jour automatiquement."
            echo
            echo "## Nouveautés"
            git log --no-merges --format='- %s' ${previous:+"$previous.."}"$GITHUB_REF_NAME" \
              | grep -v '^- Version [0-9]' || echo "- Corrections mineures"
          } > notes.md
          cat notes.md

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "Postitte $GITHUB_REF_NAME" --notes-file notes.md
