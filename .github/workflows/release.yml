name: Release

# Pousser un tag « v1.2.3 » publie la release correspondante sur GitHub,
# que l'application détecte ensuite comme mise à jour.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' postitte.py)"
          if [ "$tag" != "$code" ]; then
            echo "::error::Le tag v$tag ne correspond pas à __version__ = \"$code\" dans postitte.py"
            exit 1
          fi

      - name: Vérifier la syntaxe
        run: |
          python3 -m py_compile postitte.py
          bash -n install.sh
          bash -n uninstall.sh

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Postitte $GITHUB_REF_NAME" --generate-notes
